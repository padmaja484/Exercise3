<!DOCTYPE html>
<html>
<head>
    <title>book manage form</title>
</head>
<body>
    <h1>
        {% if book %}
            Update book
        {% else %}
            Add book
        {% endif %}
    </h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="title"
               value="{{ book.name|default:'' }}" required>
        <br><br>

        <label>author</label>
        <input type="text" name="author"
               value="{{ book.author|default:'' }}" required>
        <br><br>

        <label>Price:</label>
        <input type="number" name="price"
               value="{{ book.price|default:'' }}" required>
        <br><br>

        <button type="submit">Save Book</button>
    </form>

    <br>
    <a href="{% url 'book_list' %}">Back to List</a>
</body>
</html>
