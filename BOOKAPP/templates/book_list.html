<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
</head>
<body>
    <h1>Student Management System</h1>

    <a href="{% url 'book_create' %}">
        Add Student
    </a>

    <hr>

    <table border="1" cellpadding="10">
        <tr>
            <th>title</th>
            <th>author</th>
            <th>price</th>
           
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>
                <a href="{% url 'book_update' book.id %}">
                    Edit
                </a>

                <form method="POST"
                      action="{% url 'book_delete' book.id %}"
                      style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No students found</td>
        </tr>
        {% endfor %}
    </table>
</body>
